<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crypto Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0f17;--panel:#121826;--panel2:#18203a;--line:#26304a;--text:#e7ecf5;--muted:#8a96b0;
  --green:#3ddc97;--red:#ff5c7a;--amber:#ffb547;--blue:#5aa9ff;--violet:#a98bff;--ice:#7fe3ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
a{color:var(--blue)}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand h1{font-size:22px;margin:0;letter-spacing:.3px}
.brand .tag{font-size:12px;color:var(--muted)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center;font-weight:700;color:#06121b}
.player{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;min-width:300px}
.lvl{font-weight:700}
.xpbar{height:8px;background:#0a0e18;border-radius:6px;overflow:hidden;width:170px;margin-top:5px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--blue))}
.streak{font-size:13px;color:var(--amber);white-space:nowrap}
.banner{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:14px;border:1px solid}
.banner.demo{background:#2a2110;border-color:#5b4614;color:#ffd892}
.banner.cool{background:#10262a;border-color:#1f5560;color:#9ff0ff}
nav{display:flex;gap:6px;margin:18px 0 14px;flex-wrap:wrap}
nav button{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:8px 14px;border-radius:999px;font:inherit;cursor:pointer}
nav button.on{color:var(--text);border-color:var(--blue);background:#132140}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative}
.coinhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sym{font-size:20px;font-weight:700}
.nm{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.px{text-align:right;flex:none}
.px .small{line-height:1.5}
.px b{font-size:18px;display:inline-block;min-width:8ch}
.mono,.px,.rung b,.bk b{font-variant-numeric:tabular-nums}
.up{color:var(--green)}.dn{color:var(--red)}
.mission{margin:12px 0;border-radius:12px;padding:12px;border:1px solid;height:196px;display:flex;flex-direction:column;overflow:hidden}
.mission .btns{margin-top:auto;padding-top:8px}
.mission .k{font-size:11px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
.mission .t{font-size:15px;margin-top:4px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.m-hold{background:#0f1f1a;border-color:#1f4a3a}.m-hold .k{color:var(--green)}
.m-buy{background:#0f1f1a;border-color:#2f7a55}.m-buy .k{color:var(--green)}
.m-trim{background:#2a1418;border-color:#6a2635}.m-trim .k{color:var(--red)}
.m-stop{background:#2a1a0c;border-color:#6b4317}.m-stop .k{color:var(--amber)}
.m-zone{background:#0d2228;border-color:#1f5560}.m-zone .k{color:var(--ice)}
.m-wait{background:#171b26;border-color:var(--line)}.m-wait .k{color:var(--muted)}
.why{font-size:12px;color:var(--muted);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.b{font:inherit;font-size:13px;border-radius:9px;padding:7px 12px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
button.b.pri{background:var(--blue);border-color:var(--blue);color:#06121b;font-weight:600}
button.b.go{background:var(--green);border-color:var(--green);color:#05150e;font-weight:600}
button.b.warn{background:transparent;border-color:#6a2635;color:var(--red)}
button.b:disabled{opacity:.45;cursor:default}
.sect{font-size:11px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin:12px 0 6px;display:flex;justify-content:space-between}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:9px;padding:6px 8px;background:#0e1320;display:flex;gap:6px;align-items:flex-start}
.chip .d{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:none;background:#2d3650}
.chip.on{border-color:#6a2635;background:#1e1016}.chip.on .d{background:var(--red);box-shadow:0 0 8px var(--red)}
.chip.bon{border-color:#1f5560;background:#0c1d22}.chip.bon .d{background:var(--ice);box-shadow:0 0 8px var(--ice)}
.chip small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:10.5px;margin-top:2px;min-height:2.6em}
.chip.man{cursor:pointer}
.chip.man:hover{border-color:#47557a}
.meter{display:flex;gap:4px;margin-top:4px}
.meter i{flex:1;height:6px;border-radius:3px;background:#222a40}
.meter i.f{background:var(--red)}
.rungs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rung{border:1px solid var(--line);border-radius:9px;padding:6px;text-align:center;font-size:12px;background:#0e1320}
.rung b{display:block;font-size:13px}
.rung.hit{border-color:#24477a;background:#0e1a2c}
.rung.done{border-color:#1f4a3a;background:#0f1f1a}
.rung small{color:var(--muted)}
.buckets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;font-size:12px}
.bk{background:#0e1320;border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.bk b{display:block;font-size:14px}
.bk small{color:var(--muted)}
svg.spark{width:100%;height:46px;display:block;margin-top:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
input,select,textarea{font:inherit;background:#0c111d;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 9px;width:100%}
label{font-size:12px;color:var(--muted);display:block;margin:8px 0 4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modal{position:fixed;inset:0;background:rgba(3,6,12,.75);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.open{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:520px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.modal h3{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1b2442;border:1px solid var(--violet);padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:60;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.panic{position:fixed;right:18px;bottom:18px;z-index:40;background:#2a1418;border:1px solid #6a2635;color:#ffb3c1;border-radius:999px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.foot{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.5}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.lv{color:var(--green);border-color:#1f4a3a;background:#0f1f1a}
pre{white-space:pre-wrap;background:#0c111d;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.live i{width:8px;height:8px;border-radius:50%;background:#4a5470}
.live.on{color:var(--green);border-color:#1f4a3a}.live.on i{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.6s infinite}
.live.warn{color:var(--amber);border-color:#6b4317}.live.warn i{background:var(--amber)}
@keyframes pulse{50%{opacity:.35}}
.banner.stale{background:#2a1a0c;border-color:#6b4317;color:#ffd2a1}
.modal .box.wide{max-width:980px}
#chart{height:430px;margin-top:10px}
.ivs{display:flex;gap:6px;flex-wrap:wrap}
.ivs button.on{border-color:var(--blue);background:#132140}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span:before{content:"";display:inline-block;width:14px;height:3px;margin-right:5px;vertical-align:middle;background:var(--c)}
@media (max-width:520px){.player{min-width:0;width:100%}.xpbar{width:120px}.three{grid-template-columns:1fr 1fr}}
</style>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>

<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">CC</div><div><h1>Crypto Coach</h1><div class="tag">Your rules, not your gut.</div></div></div>
    <div class="player">
      <div style="flex:1"><div class="lvl" id="lvlName">-</div><div class="xpbar"><i id="xpFill"></i></div><div class="small muted mono" id="xpText"></div></div>
      <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><div class="streak" id="streak"></div><div class="live" id="liveStatus"><i></i><span>offline</span></div></div>
    </div>
  </header>
  <div id="banners"></div>
  <nav id="tabs">
    <button data-t="missions" class="on">🎯 Today</button>
    <button data-t="orders">📋 Orders &amp; lots</button>
    <button data-t="market">🌡 Market</button>
    <button data-t="journal">📓 Journal</button>
    <button data-t="backtest">🧪 Backtest</button>
    <button data-t="setup">⚙️ Setup</button>
  </nav>
  <main id="view"></main>
  <div class="foot" id="foot"></div>
</div>
<button class="panic" id="panicBtn">😰 I want to sell</button>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
const APP_VERSION = "5.4.0";
const DEMO = /*DEMO*/null;
const DEMO_CANDLES = /*DEMOC*/null;
const KEY = "crypto_coach_v1";
const FLAG_INFO = {
  vertical:{n:"Vertical move",h:"Hundreds of % in days"},
  stretched:{n:"Stretched",h:"Far above its averages"},
  rsi:{n:"Extreme RSI",h:"Overbought"},
  leverage:{n:"Leverage piling in",h:"Funding / open interest"},
  news:{n:"News priced in",h:"Real catalyst, all in days",ov:true},
  fomo:{n:"Social FOMO",h:"Trending + hype headlines",ov:true}
};
const BOTTOM_INFO = {freefall:"Freefall", stretched_down:"Stretched below", oversold:"Oversold RSI",
  shorts_crowded:"Shorts crowded", capitulation:"Capitulation volume", near_200w:"Near 200-week avg"};
const NBOTTOMS = Object.keys(BOTTOM_INFO).length;
const LEVELS = [[0,"Paper Hands"],[150,"Rookie Stacker"],[400,"Ladder Climber"],[800,"Rule Follower"],[1400,"Steel Core"],[2200,"Cycle Rider"],[3200,"Diamond Discipline"]];

let S = load();
let DATA = null, IS_DEMO = false, TAB = "missions", FETCH_ERR = null, NEWSF = {coin:"all",tag:"all"};

function blank(){return {xp:0,log:[],streak:{last:null,count:0,best:0},startedAt:Date.now(),lastOffPlan:null,
  reserve:{total:0,alloc:{}},spent:{},coins:{},settings:{dataUrl:"signals.json",repoUrl:""},panic:null};}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.coins)return Object.assign(blank(),s);}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function C(sym){if(!S.coins[sym])S.coins[sym]={core:0,trade:0,avgCost:0,recurring:""};return S.coins[sym];}

/* ---------- formatting ---------- */
const money=x=>x==null||isNaN(x)?"–":x===0?"$0":(Math.abs(x)>=1000?"$"+x.toLocaleString(undefined,{maximumFractionDigits:0}):Math.abs(x)>=1?"$"+x.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}):"$"+x.toFixed(4));
const qty=x=>x==null||isNaN(x)?"–":Math.abs(x)<1&&x!==0?(+x).toPrecision(4):(+x).toLocaleString(undefined,{maximumFractionDigits:x<10?4:2});
const pc=x=>x==null?"–":(x>0?"+":"")+x.toFixed(1)+"%";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);

/* ---------- game ---------- */
function level(){let i=0;LEVELS.forEach((l,k)=>{if(S.xp>=l[0])i=k;});return i;}
function addXP(n,text,coin,type){S.xp=Math.max(0,S.xp+n);S.log.unshift({ts:Date.now(),type:type||"info",coin:coin||"",text,xp:n});S.log=S.log.slice(0,300);
  const before=level();save();toast((n>=0?"+":"")+n+" XP · "+text.split(/\.(\s|$)/)[0]);
  if(level()>before)setTimeout(()=>toast("⬆️ Level up: "+LEVELS[level()][1]),1400);}
function checkIn(){const t=today();if(S.streak.last===t)return false;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.count=S.streak.last===y?S.streak.count+1:1;S.streak.best=Math.max(S.streak.best,S.streak.count);S.streak.last=t;
  addXP(10,"Daily check-in. Doing nothing on a no-signal day is a win.","","checkin");return true;}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2200);}

/* ---------- flags ---------- */
const NFLAGS=Object.keys(FLAG_INFO).length;
function ovr(sym,k){const o=(C(sym).ovr||{})[k];return o&&Date.now()-o.ts<7*864e5?o:null;}
function flagOn(c,k){const o=ovr(c.symbol,k);if(o)return o.v;return !!(c.flags&&c.flags[k]&&c.flags[k].on);}
function flagsOn(c){return Object.keys(FLAG_INFO).filter(k=>flagOn(c,k));}
function tierOf(n){return n<3?0:n===3?1:n<=5?2:3;}
/* ---------- v5 plan: scheduled buys, 70/30 split, monthly lots, +20/+40 sells, -20/-40 buy-backs ---------- */
const FEE=0.0025, TP=[20,40], BB=[20,40], MIN_ORDER=5, TINY=1e-12;
function P(){S.plan=S.plan||{days:[1,15],core:70,amounts:{},bull:true};if(!S.plan.amounts)S.plan.amounts={};return S.plan;}
function M(sym){const me=C(sym);
  if(!me.v5){const old=(me.core||0)+(me.trade||0);me.v5={lots:[],sales:[],periods:{},snooze:{},nextId:1,migrated:old>0?old:0};
    me.core=old;me.trade=0;save();}   // v4 holdings become Core: you were holding them, nothing is sold
  return me.v5;}
function ymdLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{month:"short",day:"numeric"});
function monthKey(ts){const d=new Date(ts==null?Date.now():ts);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function lotName(l){const [y,m]=l.month.split("-");return new Date(+y,+m-1,1).toLocaleDateString(undefined,{month:"short",year:"2-digit"});}
function planDays(){const ds=(P().days||[1,15]).map(x=>Math.min(28,Math.max(1,Math.round(+x)||0))).filter(x=>x>=1);return [...new Set(ds.length?ds:[1])].sort((a,b)=>a-b);}
function periodStart(now){now=now||new Date();const ds=planDays(),d=now.getDate(),past=ds.filter(x=>x<=d);
  return past.length?new Date(now.getFullYear(),now.getMonth(),past[past.length-1]):new Date(now.getFullYear(),now.getMonth()-1,ds[ds.length-1]);}
function nextBuyDay(now){now=now||new Date();const ds=planDays(),fut=ds.filter(x=>x>now.getDate());
  return fut.length?new Date(now.getFullYear(),now.getMonth(),fut[0]):new Date(now.getFullYear(),now.getMonth()+1,ds[0]);}
function planAmt(sym){return +(P().amounts[sym]||0);}
/* month rollover: buy-backs live until the month ends; unfilled ones are cancelled and their cash
   joins the next 3 buy days at the new month's prices (all of it to Trade, since it was Trade money) */
const ROLL_DAYS=3;
function R(sym){const v=M(sym);v.roll=v.roll||{usd:0,left:0};return v.roll;}
function rollExtra(sym){const r=R(sym);return r.usd>0.005&&r.left>0?r.usd/r.left:0;}
function expiredSales(sym){const mk=monthKey();return M(sym).sales.filter(s=>monthKey(s.ts)<mk&&s.levels.some(x=>!x.done));}
function buyDue(sym){return (planAmt(sym)>0||rollExtra(sym)>0)&&!M(sym).periods[ymdLocal(periodStart())];}

/* trend: price vs the 200-day average, and whether that average is rising (watcher sends ma200 and ma200_prev, 20 days earlier) */
function trend(c){const p=c.price,a=c.ma200,b=c.ma200_prev;
  if(!a)return {k:"none",label:"Trend: not enough history"};
  const up=b?a>b:null;
  if(p>a&&up!==false)return {k:"bull",label:`🐂 Bull trend · above the 200-day average${up?" (rising)":""}`};
  if(p<a&&up!==true)return {k:"bear",label:`🐻 Bear trend · below the 200-day average${up===false?" (falling)":""}`};
  return {k:"side",label:"↔ Sideways · mixed signals around the 200-day average"};}

/* lots: one per calendar month (until it first sells); each lot sells half at +20%, the rest at +40% */
function lotPer(l){return l.q>TINY?l.cost/l.q:0;}
function lotTP(l,k){return lotPer(l)*(1+TP[k]/100);}
function addTrade(sym,q,usd,ts){if(q<=TINY)return null;const v=M(sym),mk=monthKey(ts);
  let l=v.lots.find(x=>x.month===mk&&!x.sold&&!x.runner);
  if(l){l.q+=q;l.cost+=usd;l.q0=l.q;l.done=[false,false];}
  else{l={id:v.nextId++,month:mk,q,q0:q,cost:usd,done:[false,false],runner:false,sold:false};v.lots.push(l);}
  return l;}
function tradeQty(sym){return M(sym).lots.reduce((a,l)=>a+l.q,0);}
function waitingUsd(sym){return M(sym).sales.reduce((a,s)=>a+s.levels.filter(x=>!x.done).reduce((b,x)=>b+x.usd,0),0)+R(sym).usd;}
function okey(o){return o.kind+":"+(o.lot?o.lot.id+":"+o.k:o.sale.id+":"+o.i);}
function openOrders(sym,c){const v=M(sym),out=[],bullNow=P().bull&&c&&trend(c).k==="bull";
  for(const l of v.lots){
    if(l.runner){out.push({kind:"runner",lot:l,k:2,price:lotPer(l)*2,q:l.q,label:`${lotName(l)} lot · runner +100%`});continue;}
    const q1=l.done[0]?0:Math.min(l.q0/2,l.q);
    if(!l.done[0])out.push({kind:"sell",lot:l,k:0,price:lotTP(l,0),q:q1,label:`${lotName(l)} lot · +${TP[0]}%`});
    if(!l.done[1]){const rest=l.q-q1;out.push({kind:"sell",lot:l,k:1,price:lotTP(l,1),q:bullNow?rest/2:rest,bull:bullNow,
      label:`${lotName(l)} lot · +${TP[1]}%${bullNow?" (bull: keep half)":""}`});}}
  for(const s of v.sales)s.levels.forEach((x,i)=>{if(!x.done)out.push({kind:"buyback",sale:s,i,price:x.price,usd:x.usd,
    label:`Buy back −${x.pct}% · from ${fmtDate(s.ts)} sale`});});
  return out.sort((a,b)=>b.price-a.price);}

function directive(c){const sym=c.symbol,v=M(sym),px=c.price,now=Date.now();
  if(c.error)return {k:"wait",title:"⏸ Rules paused",text:`The watcher couldn't update ${sym}: ${c.error}`,why:"Showing its last good data."};
  if(DATA&&!IS_DEMO&&ageMin()>360)return {k:"wait",title:"⏸ Data is stale",text:"The watcher hasn't published for 6+ hours, so prices may be old.",why:"Check GitHub → Actions."};
  const sn=k=>v.snooze[k]&&now-v.snooze[k]<12*36e5, os=openOrders(sym,c);
  const sell=os.filter(o=>o.kind!=="buyback"&&px>=o.price&&!sn(okey(o))).sort((a,b)=>a.price-b.price)[0];
  if(sell)return {k:"trim",title:"🔴 SELL · take profit",act:"sell",o:sell,text:`Sell ${qty(sell.q)} ${sym} at ${money(sell.price)} · ${sell.label}.`,why:"This lot reached its target. Core is never sold."};
  const run=v.lots.find(l=>l.runner&&c.ma50&&px<c.ma50&&!sn("runner:"+l.id+":2"));
  if(run){const o={kind:"runner",lot:run,k:2,price:px,q:run.q,label:`${lotName(run)} lot · runner exit`,exit:true};
    return {k:"trim",title:"🔴 SELL · runner exit",act:"sell",o,text:`Sell the ${qty(run.q)} ${sym} runner at market. The bull run is fading (price closed below its 50-day average).`,why:"Bull mode kept half of this lot for a bigger move. That move is over."};}
  const bb=os.filter(o=>o.kind==="buyback"&&px<=o.price&&!sn(okey(o)))[0];
  if(bb)return {k:"buy",title:"🟢 BUY BACK",act:"buyback",o:bb,text:`Buy back ${money(bb.usd)} of ${sym} at ${money(bb.price)} · ${bb.label}.`,why:"Half the money from that sale, 20% / 40% below the sale price."};
  const ex=expiredSales(sym);
  if(ex.length){const n=ex.reduce((a,s)=>a+s.levels.filter(x=>!x.done).length,0),usd=ex.reduce((a,s)=>a+s.levels.filter(x=>!x.done).reduce((b,x)=>b+x.usd,0),0);
    return {k:"zone",title:"🧹 NEW MONTH · re-baseline",act:"roll",text:`Cancel your ${n} unfilled ${sym} buy-back order${n>1?"s":""} on Kraken. Its ${money(usd)} joins your next ${ROLL_DAYS} buy days at this month's prices.`,why:"Old buy-back prices may never come back. This keeps every dollar working off the current baseline."};}
  if(!planAmt(sym)&&!v.lots.length&&!(C(sym).core>0)&&!rollExtra(sym))return {k:"wait",title:"👋 Not started",text:`Set how much to buy on each buy day for ${sym} in Setup.`,why:`Buy days: ${planDays().map(d=>d+(d===1?"st":d===2?"nd":d===3?"rd":"th")).join(" and ")} of the month.`};
  if(buyDue(sym)){const a=planAmt(sym),cs=P().core/100,e=rollExtra(sym);
    return {k:"buy",title:"🗓 BUY DAY",act:"buyday",text:`Buy ${money(a+e)} of ${sym}: ${money(a*cs)} to Core, ${money(a*(1-cs)+e)} to the ${lotName({month:monthKey()})} Trade lot${e?` (includes ${money(e)} rolled-over sale cash)`:""}.`,why:"Scheduled buy. Don't wait for a dip: over 10 years, timing didn't beat the schedule."};}
  const nf=flagsOn(c).length;
  if(nf>=3)return {k:"stop",title:"🟡 HEADS UP · overheated",text:`${nf} of ${NFLAGS} top flags are on. Check your sell orders are on Kraken. No extra buys beyond the schedule.`,why:"Context, not a trigger. Core is never sold."};
  if((c.bottom_count||0)>=3)return {k:"zone",title:"🟡 HEADS UP · washed out",text:`${c.bottom_count} of ${NBOTTOMS} bottom signals are on. Stick to the schedule. Your buy-backs are waiting lower.`,why:"Context, not a trigger. This is when people panic-sell. Don't."};
  const ns=os.filter(o=>o.kind!=="buyback").sort((a,b)=>a.price-b.price)[0],nb=os.find(o=>o.kind==="buyback");
  return {k:"hold",title:"✅ HOLD",text:`Nothing to do.${ns?` Next sell ${money(ns.price)}.`:""}${nb?` Next buy-back ${money(nb.price)}.`:""} Next buy day ${fmtDate(nextBuyDay())}.`,why:trend(c).label};}

function liveSpark(c){const v=(c.spark||[]).slice();if(c.live&&v.length)v[v.length-1]=c.price;return v;}
function spark(vals,col){if(!vals||vals.length<2)return "";const mn=Math.min(...vals),mx=Math.max(...vals),w=300,h=46;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*w,h-3-(v-mn)/((mx-mn)||1)*(h-6)]);
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path d="${d} L${w} ${h} L0 ${h}Z" fill="${col}" opacity=".08"/><path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/><circle cx="${pts[pts.length-1][0]-2}" cy="${pts[pts.length-1][1]}" r="2.6" fill="${col}"/></svg>`;}
function weather(c){const nf=flagsOn(c).length,nb=c.bottom_count||0,t=trend(c);
  return `<span class="pill" title="${esc(t.label)}">${t.k==="bull"?"🐂 Bull":t.k==="bear"?"🐻 Bear":t.k==="side"?"↔ Sideways":"– Trend"}</span>

/* ---------- logging ---------- */
function curO(sym){return directive(eff(coinData(sym)));}
function logBuyDay(sym,scheduled){const c=eff(coinData(sym)),e=scheduled?rollExtra(sym):0,a=(planAmt(sym)+e)||"",cs=P().core;
  modal(`<h3>${scheduled?"Buy day":"Log a buy"} · ${sym}</h3><p class="small muted">${cs}% goes to Core (never sold), ${100-cs}% to the ${lotName({month:monthKey()})} Trade lot.</p>
  <div class="two"><div><label>Spent ($)</label><input type="number" step="any" id="mAmt" value="${a}"></div><div><label>Price paid</label><input type="number" step="any" id="mPx" value="${(+c.price).toPrecision(6)}"></div></div>
  <div class="btns"><button class="b pri" onclick="confirmBuyDay('${sym}',${scheduled})">Log it</button><button class="b" onclick="closeModal()">Cancel</button></div>`);}
function confirmBuyDay(sym,scheduled){const amt=+document.getElementById("mAmt").value,px=+document.getElementById("mPx").value;
  if(!(amt>0&&px>0))return toast("Enter what you spent and the price");
  const me=C(sym),v=M(sym),cs=P().core/100,q=amt*(1-FEE)/px;
  // rolled-over sale cash (scheduled buys only) goes 100% to Trade; the rest splits Core / Trade
  const r=R(sym),e=scheduled?Math.min(rollExtra(sym),amt):0,base=amt-e,coreUsd=base*cs,tradeUsd=amt-coreUsd;
  me.core+=coreUsd*(1-FEE)/px;addTrade(sym,tradeUsd*(1-FEE)/px,tradeUsd);
  if(e>0){r.usd=Math.max(0,r.usd-e);r.left=Math.max(0,r.left-1);if(r.usd<0.005){r.usd=0;r.left=0;}}
  if(scheduled)v.periods[ymdLocal(periodStart())]="bought";
  closeModal();addXP(15,`Bought ${money(amt)} of ${sym} at ${money(px)}: ${qty(coreUsd*(1-FEE)/px)} to Core, ${qty(tradeUsd*(1-FEE)/px)} to Trade${e>0?` (incl. ${money(e)} rolled-over cash)`:""}.`,sym,"buy");render();}
function confirmRoll(sym){const v=M(sym),r=R(sym);let usd=0;
  for(const s of expiredSales(sym))for(const x of s.levels)if(!x.done){usd+=x.usd;x.done=true;x.expired=true;}
  v.sales=v.sales.filter(s=>s.levels.some(x=>!x.done));r.usd+=usd;r.left=ROLL_DAYS;save();
  addXP(10,`Re-baselined ${sym}: ${money(usd)} of old buy-back cash joins the next ${ROLL_DAYS} buy days.`,sym,"roll");render();}
function skipBuyDay(sym){M(sym).periods[ymdLocal(periodStart())]="skipped";addXP(5,`Skipped a buy day on ${sym}. Honest logging still counts.`,sym,"skip");render();}
function notYet(sym){const d=curO(sym);if(!d.o)return;M(sym).snooze[okey(d.o)]=Date.now();save();toast("OK. I'll ask again in 12 hours. Your limit order is still working.");render();}
function logSell(sym){const d=curO(sym);if(d.act!=="sell")return;const o=d.o;
  modal(`<h3>Sold · ${sym}</h3><p class="small muted">${esc(o.label)}. Enter what actually filled on Kraken.</p>
  <div class="two"><div><label>Coins sold</label><input type="number" step="any" id="mQ" value="${(+o.q).toPrecision(6)}"></div><div><label>Price</label><input type="number" step="any" id="mPx" value="${(+o.price).toPrecision(6)}"></div></div>
  <div class="btns"><button class="b pri" onclick="confirmSell('${sym}')">Log it</button><button class="b" onclick="closeModal()">Cancel</button></div>`);}
function applySell(sym,o,q,px,ts){const me=C(sym),v=M(sym),l=o.lot;q=Math.min(q,l.q);if(q<=TINY)return null;
  const per=lotPer(l),got=q*px*(1-FEE);l.q-=q;l.cost-=per*q;l.sold=true;
  if(o.kind==="runner"){l.runner=false;l.done=[true,true];}
  else{l.done[o.k]=true;if(o.k===1&&o.bull&&l.q>TINY)l.runner=true;}
  const levels=got/BB.length<MIN_ORDER?[{pct:BB[0],price:px*(1-BB[0]/100),usd:got,done:false}]
    :BB.map(p=>({pct:p,price:px*(1-p/100),usd:got/BB.length,done:false}));
  const sale={id:v.nextId++,lot:l.id,ts:ts||Date.now(),q,price:px,got,levels,rebought:0,swept:0};v.sales.push(sale);
  v.lots=v.lots.filter(x=>{if(x.q<=TINY)return false;if(x.done[0]&&x.done[1]&&!x.runner){me.core+=x.q;return false;}return true;});
  save();return sale;}
function confirmSell(sym){const d=curO(sym);if(d.act!=="sell")return closeModal();const q=+document.getElementById("mQ").value,px=+document.getElementById("mPx").value;
  if(!(q>0&&px>0))return toast("Enter coins sold and price");const s=applySell(sym,d.o,q,px);closeModal();
  if(s)addXP(60,`Took profit: sold ${qty(s.q)} ${sym} at ${money(px)} for ${money(s.got)}. Buy-backs set at ${s.levels.map(x=>money(x.price)).join(" and ")}.`,sym,"sell");render();}
function logBuyBack(sym){const d=curO(sym);if(d.act!=="buyback")return;const o=d.o;
  modal(`<h3>Bought back · ${sym}</h3><p class="small muted">${esc(o.label)}. Any coins beyond what you sold go to Core.</p>
  <div class="two"><div><label>Spent ($)</label><input type="number" step="any" id="mAmt" value="${(+o.usd).toFixed(2)}"></div><div><label>Price</label><input type="number" step="any" id="mPx" value="${(+o.price).toPrecision(6)}"></div></div>
  <div class="btns"><button class="b pri" onclick="confirmBuyBack('${sym}')">Log it</button><button class="b" onclick="closeModal()">Cancel</button></div>`);}
function applyBuyBack(sym,o,usd,px){const me=C(sym),v=M(sym),s=o.sale,lv=s.levels[o.i];
  const q=usd*(1-FEE)/px;lv.done=true;s.rebought+=q;
  const extra=Math.max(0,Math.min(q,s.rebought-s.q-s.swept));s.swept+=extra;me.core+=extra;
  addTrade(sym,q-extra,usd*(q-extra)/q);v.sales=v.sales.filter(x=>x.levels.some(y=>!y.done));save();return {q,extra};}
function confirmBuyBack(sym){const d=curO(sym);if(d.act!=="buyback")return closeModal();const usd=+document.getElementById("mAmt").value,px=+document.getElementById("mPx").value;
  if(!(usd>0&&px>0))return toast("Enter what you spent and the price");const r=applyBuyBack(sym,d.o,usd,px);closeModal();

const BT_NAMES={app:"Crypto Coach (as built)",ladder_only:"Ladder only (no buy-early)",reanchor:"Ladder moves after trims",hybrid:"Half monthly + half deep ladder",
  rise:"Rise ladder: take-profits +25/50/75/100%",rise_flags:"Rise ladder + sell early when overheated",
  yours_10_20:"Your method: TP +10/+20%, rebuy −10/−20%",yours_20_40:"Your method: TP +20/+40%, rebuy −20/−40%",yours_30_60:"Your method: TP +30/+60%, rebuy −30/−60%",
  proposed:"Proposed tweaks",dca:"Monthly DCA",lump:"All-in on day 1",cash:"Keep the cash"};
const score=r=>r.coin_equiv!=null?r.coin_equiv:r.coins;
const ACC_NAMES={A:"A · Dip ladder, one average for the trade bucket",A_lots:"A · Dip ladder, every buy its own lot",B_strict:"B · Washed out (3+) and turning up",B_loose:"B · Washed out (2+) and turning up",dca:"C · Monthly DCA (benchmark)"};
function coinsAcc(){return (BT.coins||[]).filter(c=>c.accumulate);}
function renderAccumulate(){const O=BT.accumulate_overall,AA=BT.accumulate_assumptions;if(!O||!O.length)return "";
  const coins=BT.coins.filter(c=>c.accumulate);const a0=coins[0].accumulate;
  let h=`<div class="card" style="margin-top:14px"><b>Accumulate from zero: which buy-in signal works?</b> <span class="small muted">· ${a0.start} → ${a0.end} (${a0.days} days)</span>
    <p class="small muted" style="margin:4px 0 8px">${esc(AA.money)}. ${esc(AA.split)}. ${esc(AA.ladder)}. ${esc(AA.signals)}. Money no signal used within 60 days is bought anyway.
    Orders under $5 aren't placed. <b>Stress test:</b> each model also starts 3, 6 and 9 months later, and each half of the period is run on its own.
    A model has to beat <b>C</b> on most coins, start dates and halves to be worth the effort. Winning one stretch only = luck.</p>
    <table><tr><th>Buy-in signal</th><th>Coins beating DCA</th><th>Start dates beating DCA</th><th>Halves beating DCA</th><th>Average vs DCA</th><th>Worst coin</th><th>Worst of any start</th><th>Trades</th></tr>
    ${O.map(r=>{const tr=coinsAcc().reduce((n,c)=>n+c.accumulate.results[r.strategy].buys+c.accumulate.results[r.strategy].sells,0);return `<tr><td>${ACC_NAMES[r.strategy]||r.strategy}</td><td class="mono">${r.coins_beating_dca} / ${r.coins}</td><td class="mono">${r.starts!=null?r.starts_beating_dca+" / "+r.starts:"—"}</td><td class="mono">${r.halves_beating_dca} / ${r.halves}</td><td class="mono ${r.avg_vs_dca_pct>=0?"up":"dn"}">${pc(r.avg_vs_dca_pct)}</td><td class="mono ${r.worst_vs_dca_pct>=0?"up":"dn"}">${pc(r.worst_vs_dca_pct)}</td><td class="mono ${(r.starts_worst_pct||0)>=0?"up":"dn"}">${r.starts_worst_pct!=null?pc(r.starts_worst_pct):"—"}</td><td class="mono">${tr}</td></tr>`}).join("")}</table>
    <table style="margin-top:10px"><tr><th>Coin</th>${Object.keys(ACC_NAMES).map(k=>`<th>${k==="dca"?"C":k==="A_lots"?"A lots":k.replace("_"," ")}</th>`).join("")}</tr>
    ${coins.map(c=>{const R=c.accumulate.results,dca=R.dca.coin_equiv;return `<tr><td><b>${esc(c.symbol)}</b></td>${Object.keys(ACC_NAMES).map(k=>{const r=R[k];if(!r)return "<td>—</td>";
      return `<td class="mono small">${qty(r.coin_equiv)}${k==="dca"?"":` <span class="${r.coin_equiv>=dca?"up":"dn"}">${pc((r.coin_equiv/dca-1)*100)}</span>`}<br><span class="muted">core ${qty(r.core)} · ${r.buys} buys · ${r.sells} sells${r.cash>0.5?` · ${money(r.cash)} waiting`:""}</span></td>`}).join("")}</tr>`}).join("")}</table>
    <div class="small muted" style="margin-top:4px">Score = coins + cash still waiting, converted at the final price. "Core" = coins you keep for good. Same money into every model: ${money(a0.results.dca.contributed)} per coin.</div></div>`;
  return h;}
function renderBacktest(){if(!BT&&!BT_ERR){loadBacktest();return `<div class="card">Loading backtest…</div>`;}
  if(!BT)return `<div class="card muted">No backtest published yet (${esc(BT_ERR)}). It's calculated by the watcher once a day; check back after the next run.</div>`;
  const A=BT.assumptions||{};
  let h=`<div class="card"><b>What would the rules have done?</b> <span class="small muted">· last ${BT.months} months · calculated ${new Date(BT.generated_at).toLocaleString()} · v${esc(BT.version)}</span>
    <p class="small muted" style="margin:8px 0 0">Start: ${esc(A.start||"")}. Fees: ${esc(A.fees||"")}. ${esc(A.fills||"")}. Not tested: ${esc(A.not_tested||"")}.<br>
    <b>Score = total value in coins</b>: coins held plus any cash converted at the final price, so selling high and holding cash counts fairly. <b>Ladder moves after trims</b> = after each trim the ladder restarts from the trim price, using the cash on hand. <b>Half monthly + half deep ladder</b> = half the reserve bought monthly, half on a −10/−25/−40/−55% ladder that also moves after trims; no buy-early.</p></div>`;
  h=renderMyPlan()+h;
  h+=renderStress();
  h+=renderAccumulate();
  if(BT.overall&&BT.overall.length){
    h+=`<div class="card" style="margin-top:14px"><b>Overall: which approach held up across all coins?</b>
      <p class="small muted" style="margin:4px 0 8px">Compared with monthly DCA on each coin, scored as total value in coins. Look for a high <b>average</b> and a <b>worst case</b> that isn't ugly. Consistent beats spectacular.</p>
      <table><tr><th>Strategy</th><th>Coins where it beat DCA</th><th>Average vs DCA</th><th>Worst coin vs DCA</th></tr>
      ${BT.overall.filter(r=>r.strategy!=="dca").map(r=>`<tr><td>${BT_NAMES[r.strategy]||r.strategy}</td><td class="mono">${r.coins_beating_dca} / ${r.coins}</td><td class="mono ${r.avg_vs_dca_pct>=0?"up":"dn"}">${pc(r.avg_vs_dca_pct)}</td><td class="mono ${r.worst_vs_dca_pct>=0?"up":"dn"}">${pc(r.worst_vs_dca_pct)}</td></tr>`).join("")}</table></div>`;}
  for(const c of BT.coins){
    if(c.error){h+=`<div class="card" style="margin-top:14px"><b>${esc(c.symbol)}</b> <span class="muted small">failed: ${esc(c.error)}</span></div>`;continue;}
    const R=c.results,best=Math.max(...Object.values(R).filter((r,i)=>Object.keys(R)[i]!=="cash").map(score)),dca=score(R.dca);
    h+=`<div class="card" style="margin-top:14px"><div class="row" style="justify-content:space-between"><b style="font-size:18px">${esc(c.symbol)}</b>
      <span class="small mono">${c.start} → ${c.end} · ${money(c.start_price)} → ${money(c.end_price)} <span class="${c.change_pct>=0?"up":"dn"}">${pc(c.change_pct)}</span> · low ${money(c.low)} · high ${money(c.high)}</span></div>
      <table style="margin-top:8px"><tr><th>Strategy</th><th>Score (in coins)</th><th>vs monthly DCA</th><th>Coins held</th><th>Value</th><th>Avg buy price</th><th>Sells</th></tr>
      ${Object.keys(BT_NAMES).filter(k=>R[k]).map(k=>{const r=R[k],sc=score(r),top=k!=="cash"&&sc===best;return `<tr style="${top?"background:#0f1f1a":""}"><td>${BT_NAMES[k]}${top?" 🏆":""}</td><td class="mono"><b>${qty(sc)}</b></td>
        <td class="mono ${sc>=dca?"up":"dn"}">${k==="dca"?"—":pc((sc/dca-1)*100)}</td><td class="mono">${qty(r.coins)}</td><td class="mono">${money(r.value)}${r.cash>0.5?` <span class="muted small">(incl. ${money(r.cash)} cash)</span>`:""}</td>
        <td class="mono">${r.avg_buy_price?money(r.avg_buy_price):"—"}</td><td class="mono">${["dca","lump","cash"].includes(k)?"—":r.trims}</td></tr>`}).join("")}</table>
      <div class="small muted" style="margin-top:4px">🏆 = best of the buying strategies. Keeping the cash is shown for reference; it always wins when prices fall, but nobody knows that in advance.</div>
      <div class="small muted" style="margin-top:6px">Signals over the period: max ${c.signals.max_top_flags} top flags, max ${c.signals.max_bottom_signals} bottom signals · ${c.signals.days_3plus_top} days with 3+ top flags · ${c.signals.days_3plus_bottom} days with 3+ bottom signals</div>
      <details style="margin-top:8px"><summary class="small">Every trade the app's rules made</summary><table>${R.app.events.map(e=>`<tr><td class="small mono">${e[0]}</td><td class="small">${esc(e[1])}</td><td class="mono small">${money(e[2])}</td><td class="mono small">${e[3]>0?"spent "+money(e[3]):"got "+money(-e[3])}</td></tr>`).join("")||`<tr><td class="muted small">No trades.</td></tr>`}</table></details>
      <details><summary class="small">Every trade with half monthly + half deep ladder</summary><table>${(R.hybrid||R.proposed).events.map(e=>`<tr><td class="small mono">${e[0]}</td><td class="small">${esc(e[1])}</td><td class="mono small">${money(e[2])}</td><td class="mono small">${e[3]>0?"spent "+money(e[3]):"got "+money(-e[3])}</td></tr>`).join("")||`<tr><td class="muted small">No trades.</td></tr>`}</table></details></div>`;}
  return h+`<p class="small muted">Past results don't predict future ones. This shows how the rules behaved on real prices, nothing more.</p>`;}

function renderJournal(){if(!S.log.length)return XP_HELP+`<div class="card muted">Nothing logged yet. Your first check-in starts the journal.</div>`;

async function fetchData(){
  const prevGen=DATA&&DATA.generated_at;
  try{const r=await fetch(S.settings.dataUrl+(S.settings.dataUrl.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(r.status);
    DATA=await r.json();IS_DEMO=false;FETCH_ERR=null;}
  catch(e){FETCH_ERR=String(e.message||e);if(DEMO){DATA=DEMO;IS_DEMO=true;}}
  if(DATA&&DATA.generated_at!==prevGen){CH.candles={};}
  if(DATA)DATA.coins.forEach(c=>C(c.symbol));save();
  const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;render();}

/* ---------- live prices (Kraken WebSocket v2, public, no key) ---------- */
const LIVE={ws:null,prices:{},mismatch:{},last:0,status:"off",tries:0,ohlc:null,dirty:false};
function ageMin(){return DATA?(Date.now()-Date.parse(DATA.generated_at))/60000:0;}
function wsSym(c){return c.ws_symbol||c.symbol+"/USD";}
function livePrice(c){const p=LIVE.prices[wsSym(c)];if(!p||Date.now()-p.ts>120000)return null;
  if(ageMin()<75&&c.price&&Math.abs(p.last/c.price-1)>0.25){LIVE.mismatch[c.symbol]=true;return null;}
  LIVE.mismatch[c.symbol]=false;return p.last;}
function eff(c){const lp=livePrice(c);if(lp==null)return c;const p=LIVE.prices[wsSym(c)];
  return Object.assign({},c,{price:lp,live:true,change_24h:p.chg!=null?p.chg:c.change_24h,
  });}
function setLive(st){LIVE.status=st;const el=document.getElementById("liveStatus");if(!el)return;
  el.className="live "+(st==="live"?"on":st==="connecting"||st==="reconnecting"?"warn":"");
  el.querySelector("span").textContent=st==="live"?"live":st==="off"?(IS_DEMO?"demo · no live feed":"offline"):st;}
function wsSend(o){if(LIVE.ws&&LIVE.ws.readyState===1)LIVE.ws.send(JSON.stringify(o));}
function connectLive(){
  if(IS_DEMO||!DATA||(LIVE.ws&&LIVE.ws.readyState<2))return;
  setLive(LIVE.tries?"reconnecting":"connecting");
  let ws;try{ws=new WebSocket("wss://ws.kraken.com/v2");}catch(e){setLive("off");return;}
  LIVE.ws=ws;
  ws.onopen=()=>{LIVE.tries=0;wsSend({method:"subscribe",params:{channel:"ticker",symbol:DATA.coins.map(wsSym)}});
    if(LIVE.ohlc)wsSend({method:"subscribe",params:{channel:"ohlc",symbol:[LIVE.ohlc.sym],interval:LIVE.ohlc.iv}});};
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(e){return;}LIVE.last=Date.now();
    if(m.channel==="ticker"&&m.data){for(const d of m.data){const last=+d.last;if(!(last>0))continue;
        LIVE.prices[d.symbol]={last,chg:d.change_pct!=null?+d.change_pct:null,ts:Date.now()};tickUI(d.symbol);}
      if(LIVE.status!=="live")setLive("live");}
    else if(m.channel==="ohlc"&&m.data&&LIVE.ohlc&&LIVE.ohlc.cb){LIVE.ohlc.cb(m.data);}
    else if(m.channel==="heartbeat"&&LIVE.status!=="live"&&Object.keys(LIVE.prices).length)setLive("live");};
  ws.onclose=()=>{setLive("reconnecting");LIVE.tries++;setTimeout(connectLive,Math.min(30000,1000*2**LIVE.tries));};
  ws.onerror=()=>{try{ws.close();}catch(e){}};}
function tickUI(ws){const c=DATA&&DATA.coins.find(x=>wsSym(x)===ws);if(!c)return;const e=eff(c);
  const px=document.getElementById("px-"+c.symbol);if(px&&px.textContent!==money(e.price)){px.textContent=money(e.price);}
  const ch=document.getElementById("ch-"+c.symbol);if(ch){ch.textContent=pc(e.change_24h)+" 24h";ch.className=e.change_24h>=0?"up":"dn";}
  const src=document.getElementById("src-"+c.symbol);if(src){src.textContent=e.live?"● live":"watcher";src.className="pill "+(e.live?"lv":"");}
  const sp=document.getElementById("sp-"+c.symbol);if(sp){const col=(c.change_7d||0)>=0?"var(--green)":"var(--red)";sp.innerHTML=spark(liveSpark(e),col);}
  const cp=document.getElementById("chartPx");if(cp&&CH.sym===c.symbol)cp.textContent=money(e.price);
  LIVE.dirty=true;}
// re-check missions with live prices every 20s (never while you're typing or a dialog is open)
setInterval(()=>{if(!LIVE.dirty||TAB!=="missions")return;if(document.getElementById("modal").classList.contains("open"))return;
  const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;LIVE.dirty=false;
  const sig=DATA.coins.map(c=>{const d=directive(eff(c));return c.symbol+d.k+d.title+d.text;}).join("|");
  if(sig!==LIVE.sig){LIVE.sig=sig;render();}},20000);
// watchdog: no message for 60s means the feed is dead
setInterval(()=>{if(LIVE.status==="live"&&Date.now()-LIVE.last>60000){setLive("reconnecting");try{LIVE.ws.close();}catch(e){}}},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){fetchData();if(!LIVE.ws||LIVE.ws.readyState>1)connectLive();}});

const IV={"1h":60,"4h":240,"1d":1440,"1w":10080};
const CH={chart:null,series:null,sym:null,iv:"1d",candles:{},lastT:0,ro:null};
async function getCandles(sym){if(CH.candles[sym])return CH.candles[sym];
  if(IS_DEMO&&DEMO_CANDLES)return CH.candles[sym]=DEMO_CANDLES[sym];

  return CH.candles[sym]=await r.json();}
function smaLine(bars,n){const out=[];let sum=0;for(let i=0;i<bars.length;i++){sum+=bars[i].close;if(i>=n)sum-=bars[i-n].close;if(i>=n-1)out.push({time:bars[i].time,value:sum/n});}return out;}

    <p class="small muted">Decide on the <b>1D</b> chart, check the big picture on <b>1W</b>. 1H and 4H are mostly noise. Use them to watch, not to act.</p>`);

function setIv(k){CH.iv=k;document.querySelectorAll(".ivs button").forEach(b=>b.classList.toggle("on",b.dataset.iv===k));drawChart();}
function stopChart(){if(LIVE.ohlc){wsSend({method:"unsubscribe",params:{channel:"ohlc",symbol:[LIVE.ohlc.sym],interval:LIVE.ohlc.iv}});LIVE.ohlc=null;}
  if(CH.ro){CH.ro.disconnect();CH.ro=null;}if(CH.chart){CH.chart.remove();CH.chart=null;}}
async function drawChart(){const sym=CH.sym,c=coinData(sym),el=document.getElementById("chart"),note=document.getElementById("chartNote");
  if(CH.chart){if(LIVE.ohlc){wsSend({method:"unsubscribe",params:{channel:"ohlc",symbol:[LIVE.ohlc.sym],interval:LIVE.ohlc.iv}});LIVE.ohlc=null;}CH.chart.remove();CH.chart=null;}
  if(!window.LightweightCharts){el.innerHTML='<p class="muted">Chart library didn\'t load. Check your connection and reopen.</p>';return;}
  let raw;try{raw=(await getCandles(sym))[CH.iv];}catch(e){el.innerHTML=`<p class="muted">No chart data yet for ${sym} (${esc(e.message)}). It appears after the next watcher run.</p>`;return;}
  if(!raw||!raw.length){el.innerHTML='<p class="muted">No candles for this interval yet.</p>';return;}
  const bars=raw.map(k=>({time:k[0],open:k[1],high:k[2],low:k[3],close:k[4]}));CH.lastT=bars[bars.length-1].time;
  const ch=LightweightCharts.createChart(el,{height:430,layout:{background:{color:"#121826"},textColor:"#8a96b0",fontFamily:"JetBrains Mono, monospace"},
    grid:{vertLines:{color:"#1b2236"},horzLines:{color:"#1b2236"}},rightPriceScale:{borderColor:"#26304a"},timeScale:{borderColor:"#26304a",timeVisible:CH.iv==="1h"||CH.iv==="4h"},crosshair:{mode:0}});
  const s=ch.addCandlestickSeries({upColor:"#3ddc97",downColor:"#ff5c7a",borderVisible:false,wickUpColor:"#3ddc97",wickDownColor:"#ff5c7a"});
  s.setData(bars);
  [[20,"#5aa9ff"],[50,"#ffb547"],[200,"#a98bff"]].forEach(([n,col])=>{if(bars.length>n){const l=ch.addLineSeries({color:col,lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});l.setData(smaLine(bars,n));}});
  openOrders(sym,c).forEach(o=>s.createPriceLine({price:o.price,color:o.kind==="buyback"?"#3ddc97":"#ff5c7a",lineWidth:1,lineStyle:2,axisLabelVisible:true,
    title:o.kind==="buyback"?"buy back −"+o.sale.levels[o.i].pct+"%":o.kind==="runner"?"runner +100%":"sell +"+TP[o.k]+"%"}));
  M(sym).lots.forEach(l=>s.createPriceLine({price:lotPer(l),color:"#e7ecf5",lineWidth:1,lineStyle:0,axisLabelVisible:true,title:lotName(l)+" lot cost"}));
  const show={"1h":120,"4h":150,"1d":180,"1w":200}[CH.iv];ch.timeScale().setVisibleLogicalRange({from:bars.length-show,to:bars.length+3});
  CH.chart=ch;CH.series=s;
  CH.ro=new ResizeObserver(()=>{if(CH.chart)CH.chart.applyOptions({width:el.clientWidth});});CH.ro.observe(el);
  if(IS_DEMO){note.textContent="Demo candles. Your GitHub app streams real ones live.";return;}
  note.textContent=LIVE.status==="live"?"Streaming live from Kraken":"History from the watcher · live feed connecting…";
  LIVE.ohlc={sym:wsSym(c),iv:IV[CH.iv],cb:data=>{for(const k of data){if(k.symbol!==wsSym(c)||+k.interval!==IV[CH.iv])continue;
      const t=Math.floor(Date.parse(k.interval_begin)/1000);if(!(t>=CH.lastT))continue;CH.lastT=t;
      const bar={time:t,open:+k.open,high:+k.high,low:+k.low,close:+k.close};if(bar.close>0&&CH.series)CH.series.update(bar);}
    note.textContent="Streaming live from Kraken";}};
  wsSend({method:"subscribe",params:{channel:"ohlc",symbol:[LIVE.ohlc.sym],interval:LIVE.ohlc.iv}});}

fetchData().then(()=>{setLive("off");connectLive();});setInterval(fetchData,5*60*1000);setInterval(renderHeader,60*1000);
</script>
