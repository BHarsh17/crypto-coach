name: Crypto Coach watcher

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:          # "Run workflow" button for a manual check
  push:
    branches: [main]          # re-run when you edit coins.json or the app

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the maths (nothing is published if this fails)
        run: python3 tests/test_watch.py

      - name: Score coins and send alerts
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/signals.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 watcher/watch.py --config coins.json --out site/signals.json

      - name: Backtest (recalculated once a day, never blocks the signals)
        continue-on-error: true
        timeout-minutes: 3
        env:
          PREV_BACKTEST_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/backtest.json
        run: python3 backtest/backtest.py --months 18 --out site/backtest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true     # GitHub sometimes can't find the upload for a few seconds

      - name: Wait, then retry the deploy once
        if: steps.deploy.outcome == 'failure'
        run: sleep 45

      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
